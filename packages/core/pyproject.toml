[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "cryptography>=43.0",
    "telethon>=1.36",
    "croniter>=2.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "httpx>=0.27",
    "openai>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
