# Server (production) uchun. Ishga tushirish: ./deploy/deploy.sh  (batafsil: DEPLOY.md)
#
# Tashqariga faqat Caddy (web) chiqadi: domen rejimida 80/443 (deploy/compose.domain.yml),
# tunnel rejimida hech qanday port ochilmaydi (HTTPS'ni Cloudflare beradi).
# Postgres, Redis va ichki API faqat Docker ichki tarmog'ida.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  env_file: .env
  logging: *logging
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://userbots:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da kerak}@postgres:5432/userbots
    REDIS_URL: redis://redis:6379
    MOCK_TELEGRAM: "false"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: userbots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da kerak}
      POSTGRES_DB: userbots
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userbots -d userbots"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # AOF — restartda navbatdagi vazifalar va Mini App keshlari yo'qolmasin.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    <<: *app
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *app
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # Tunnel rejimi: server portlari umuman ochilmaydi, HTTPS'ni Cloudflare beradi.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Har kuni bazaning zaxira nusxasi ./backups ga (BACKUP_KEEP_DAYS kundan eskilari o'chiriladi).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: userbots
      PGDATABASE: userbots
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da kerak}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
